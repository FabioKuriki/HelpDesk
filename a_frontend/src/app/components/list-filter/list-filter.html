<mat-form-field appearance="outline">
    <mat-label>Pesquisar</mat-label>
    <input [(ngModel)]="value" matInput (keyup)="applyFilter($event)" placeholder="Ex. URGENTE" #input>
    @if (value) {
        <button matSuffix matIconButton aria-label="Clear" (click)="clearFilter()">
            <mat-icon>close</mat-icon>
        </button>
    }
</mat-form-field>
