<div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>

        @for (column of columns; track column) {
            <ng-container [matColumnDef]="column.columnDef">
                <th mat-header-cell *matHeaderCellDef>
                    {{column.header}}
                </th>
                <td mat-cell *matCellDef="let row">
                    {{column.cell(row)}}
                </td>
            </ng-container>
        }

        <tr id="header" mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr [routerLink]="['/access/check-ticket', row.id]" mat-row *matRowDef="let row; columns: displayedColumns;"></tr>


        <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">Não há dados</td>
        </tr>
    </table>

    <mat-paginator [pageSizeOptions]="pageSizeOptions" aria-label="Select page of users"></mat-paginator>
</div>
